# Release blocker B2: the checks that must pass before anything merges to master.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, boundaries, unit tests, web build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Web build (emulator config; no real project needed)
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_USE_EMULATORS: "1"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-moneytrace

  emulator:
    name: Emulator suites (rules, adapters, functions)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:emulator

  e2e:
    name: End-to-end (emulators and demo data)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:fixture
