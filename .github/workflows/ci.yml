# Release blocker B2: the checks that must pass before anything merges to master.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, types, boundaries, unit tests, web build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: npm install -g corepack@0.34.6 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Web build (emulator config; no real project needed)
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_USE_EMULATORS: "1"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-moneytrace
      - name: Web build (Supabase config, as deployed; CR-010)
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  supabase:
    name: Supabase backend (real Postgres, Deno bundle)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - run: npm install -g corepack@0.34.6 && corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Adapter suites on real Postgres (true concurrency)
        run: pnpm exec vitest run --no-file-parallelism packages/infrastructure/test
        env:
          MONEYTRACE_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: /api bundle under Deno with npm:postgres
        run: pnpm smoke:supabase

  emulator:
    name: Emulator suites (rules, adapters, functions)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g corepack@0.34.6 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:emulator

  e2e:
    name: End-to-end (emulators and demo data)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install -g corepack@0.34.6 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:e2e:fixture
